      // Apply the stored or preferred theme before first paint; the app re-applies it through ui.setTheme.
      try {
        var theme = new URLSearchParams(location.search).get('theme') || localStorage.getItem('ihapm.theme');
        if (theme !== 'light' && theme !== 'dark') theme = 'dark';
        document.documentElement.dataset.theme = theme;
      } catch (e) { /* storage blocked: the app falls back to its default */ }
